<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370"><rect width="1080" height="370" fill="#e8e6df"/><g font-family="Arial,sans-serif" fill="#303d39"><text x="20" y="32" font-size="19" font-weight="bold">1. Save a checkpoint</text><text x="20" y="58" font-size="15">Blue roads · buildings visible</text><rect x="20" y="78" width="330" height="210" fill="#d8ddd5"/><rect x="44" y="98" width="60" height="40" fill="#afa99b" stroke="#827e72"/><rect x="150" y="102" width="58" height="32" fill="#afa99b" stroke="#827e72"/><rect x="250" y="93" width="64" height="44" fill="#afa99b" stroke="#827e72"/><rect x="54" y="220" width="45" height="46" fill="#afa99b" stroke="#827e72"/><rect x="168" y="231" width="52" height="35" fill="#afa99b" stroke="#827e72"/><rect x="268" y="217" width="50" height="46" fill="#afa99b" stroke="#827e72"/><path d="M20,185 L350,165 M125,78 L138,288 M240,78 L249,288" fill="none" stroke="#356e91" stroke-width="10"/><text x="20" y="319" font-size="15">Click Save checkpoint.</text><text x="375" y="32" font-size="19" font-weight="bold">2. Try another look</text><text x="375" y="58" font-size="15">Red roads · buildings hidden</text><rect x="375" y="78" width="330" height="210" fill="#d8ddd5"/><path d="M375,185 L705,165 M480,78 L493,288 M595,78 L604,288" fill="none" stroke="#b25043" stroke-width="10"/><text x="375" y="319" font-size="15">Change styles and visibility.</text><text x="730" y="32" font-size="19" font-weight="bold">3. Restore the checkpoint</text><text x="730" y="58" font-size="15">The saved look returns</text><rect x="730" y="78" width="330" height="210" fill="#d8ddd5"/><rect x="754" y="98" width="60" height="40" fill="#afa99b" stroke="#827e72"/><rect x="860" y="102" width="58" height="32" fill="#afa99b" stroke="#827e72"/><rect x="960" y="93" width="64" height="44" fill="#afa99b" stroke="#827e72"/><rect x="764" y="220" width="45" height="46" fill="#afa99b" stroke="#827e72"/><rect x="878" y="231" width="52" height="35" fill="#afa99b" stroke="#827e72"/><rect x="978" y="217" width="50" height="46" fill="#afa99b" stroke="#827e72"/><path d="M730,185 L1060,165 M835,78 L848,288 M950,78 L959,288" fill="none" stroke="#356e91" stroke-width="10"/><text x="730" y="319" font-size="15">Select step 1, then click Restore.</text><text x="20" y="352" font-size="14">Illustrated example. Restore saves step 2 as “before restore”, so you can return to it too.</text></g></svg>